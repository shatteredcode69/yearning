<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Letters to Rania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1917;
    --bg-glow: #2a2420;
    --card: #252220;
    --card-edge: #38322d;
    --ink: #ece3d1;
    --muted: #a09584;
    --accent: #9aa7e0;      /* the blue of the ink */
    --accent-soft: rgba(154, 167, 224, 0.16);
    --margin-line: rgba(154, 167, 224, 0.22);
    --shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.7);
    --serif-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --serif-body: 'Lora', Georgia, 'Times New Roman', serif;
    --fade: 280ms;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background:
      radial-gradient(ellipse 80% 55% at 50% -10%, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: var(--serif-body);
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  .app {
    min-height: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 1.25rem 1rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .progress { flex: 1 1 160px; min-width: 150px; }
  .progress-label {
    font-size: 0.9rem;
    color: var(--muted);
    font-style: italic;
    margin-bottom: 0.45rem;
  }
  .progress-track {
    height: 2px;
    background: var(--card-edge);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 500ms ease;
  }

  /* ---------- toggle ---------- */
  .toggle {
    position: relative;
    display: inline-grid;
    grid-template-columns: 1fr 1fr;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 999px;
    padding: 3px;
  }
  .toggle-thumb {
    position: absolute;
    top: 3px; bottom: 3px; left: 3px;
    width: calc(50% - 3px);
    background: var(--accent-soft);
    border: 1px solid var(--margin-line);
    border-radius: 999px;
    transition: transform 320ms cubic-bezier(.4, .1, .2, 1);
  }
  .toggle[data-mode="image"] .toggle-thumb { transform: translateX(100%); }
  .toggle button {
    position: relative;
    z-index: 1;
    background: none;
    border: 0;
    color: var(--muted);
    font: inherit;
    font-size: 0.92rem;
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    cursor: pointer;
    transition: color 250ms ease;
    min-height: 40px;
  }
  .toggle button[aria-pressed="true"] { color: var(--ink); }

  /* ---------- card ---------- */
  .stage { flex: 1; display: flex; }

  .card {
    position: relative;
    flex: 1;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 6px 14px 14px 6px;
    box-shadow: var(--shadow);
    padding: clamp(1.4rem, 4vw, 2.6rem) clamp(1.2rem, 4vw, 2.8rem) clamp(1.4rem, 4vw, 2.4rem) clamp(2.2rem, 6vw, 4.2rem);
    overflow: hidden;
  }
  /* journal margin line */
  .card::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: clamp(1.3rem, 4vw, 2.6rem);
    width: 1px;
    background: var(--margin-line);
  }

  .content {
    opacity: 1;
    transform: translateY(0);
    transition: opacity var(--fade) ease, transform var(--fade) ease;
  }
  .content.fading { opacity: 0; transform: translateY(4px); }

  .date {
    font-family: var(--serif-display);
    font-weight: 500;
    font-size: clamp(1.7rem, 1.2rem + 2vw, 2.4rem);
    letter-spacing: 0.01em;
    margin: 0 0 1.4rem;
    color: var(--ink);
  }

  .letter-text p {
    margin: 0 0 1.15em;
    font-size: clamp(1.04rem, 0.98rem + 0.3vw, 1.18rem);
    line-height: 1.9;
    max-width: 62ch;
    hyphens: auto;
    overflow-wrap: break-word;
  }
  .letter-text p.signoff {
    font-family: var(--serif-display);
    font-style: italic;
    color: var(--accent);
    margin-top: 1.8rem;
    font-size: 1.25rem;
  }
  .letter-text p.note {
    font-style: italic;
    color: var(--muted);
  }

  .letter-image { margin: 0; }
  .letter-image img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 4px;
    border: 1px solid var(--card-edge);
    background: #111;
  }
  .image-missing {
    color: var(--muted);
    font-style: italic;
    padding: 1.5rem 0;
  }

  [hidden] { display: none !important; }

  /* ---------- nav ---------- */
  .nav {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }
  .nav button {
    flex: 1 1 0;
    max-width: 220px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--card-edge);
    border-radius: 999px;
    font: inherit;
    font-size: 1rem;
    padding: 0.8rem 1.4rem;
    min-height: 48px;
    cursor: pointer;
    transition: background 250ms ease, border-color 250ms ease, opacity 250ms ease;
  }
  .nav button:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--margin-line); }
  .nav button:disabled { opacity: 0.3; cursor: default; }
  .nav #next { margin-left: auto; }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (max-width: 480px) {
    .app { padding: 0.9rem 0.7rem 1.1rem; }
    .topbar { gap: 0.8rem; }
    .toggle { width: 100%; }
    .nav button { max-width: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="progress">
      <div class="progress-label" id="progressLabel" aria-live="polite"></div>
      <div class="progress-track" role="presentation"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="toggle" id="toggle" data-mode="text" role="group" aria-label="Choose how to read this letter">
      <span class="toggle-thumb" aria-hidden="true"></span>
      <button type="button" id="btnText" aria-pressed="true">Text</button>
      <button type="button" id="btnImage" aria-pressed="false">Handwriting</button>
    </div>
  </div>

  <div class="stage">
    <article class="card">
      <div class="content" id="content">
        <h1 class="date" id="date"></h1>
        <div class="letter-text" id="letterText"></div>
        <figure class="letter-image" id="letterImage" hidden>
          <img id="letterImg" alt="" loading="lazy">
          <div class="image-missing" id="imageMissing" hidden>This page image could not be loaded. Check that the image file is in the same folder as index.html.</div>
        </figure>
      </div>
    </article>
  </div>

  <nav class="nav" aria-label="Letter navigation">
    <button type="button" id="prev">Previous</button>
    <button type="button" id="next">Next</button>
  </nav>
</main>

<script>
  const letters = [
    {
      id: 1,
      date: "April 22",
      text: "My dear Rania!\n\nThe weight of future is sitting heavily on my chest today. We were working on our final project, we were trying to piece together something meaningful, but the room just felt so suffocating. I looked at the screen, at the endless complications, and all I could think about was whether this will be enough to give you the moments you deserve. You just came to my mind like a sign. I stayed silent bearing. Right now, my hands feel terribly empty. The fear of not being enough is a cruel & constant companion. Your eyes are the only peaceful memory in this loud, chaotic world of mine. I am trying to hold it together, my blooming dream, but the cracks in my armor are starting to show. Please bear with me, even when my silence begins to speak louder than my words.\n\nAbbas!",
      imagePath: "1.jpeg"
    },
    {
      id: 2,
      date: "May 3",
      text: "My dearest Rania!\n\nThe noise has become almost unbearable. Every notification, every demand from university, every superficial conversation with the people I barely recognize as friends feels like a hammer against my weary skull. The pressure of what lies ahead is hovering over me like a dark storm cloud, and the anxiety is whispering that I am entirely lost. I am standing at a crossroad Rania! I feel a desperate, pulling urge to cut the cords, to silence the digital world before it completely consumes whatever is left of my being. I don't want to bring this heavy darkness to your doorstep, nor do I want to taint your beautiful light with my profound exhaustion. I have a decision to make about how to survive this phase. If I fade into the shadows, please know it is not because you are not deeply cherished. It is because I must step away from the noise to find a friend who is actually worthy of your existence.\n\nAbbas!",
      imagePath: "2.jpeg"
    },
    {
      id: 3,
      date: "May 28",
      text: "My dearest Rania!\n\nI am really sorry for leaving like this. I deleted all social media apps except WhatsApp as you know it's a barren land of professional chaos, university and those fake friends, noisy irritating professors' notifications etc. I do not know how my life will work out but I'm struggling and trying to make it right. I do not know why I left like this, you deserved to be told but I was so jinxed I couldn't feel what was right, what was wrong. I just left.\n\nMy dearest, I miss you so much like an injured soldier misses his home. I do not force you to believe me for whatever I say, I just want you to feel the chaos of a shattered soul and tired mind. I can't even hold a beautiful friendship. Life has made me a graveyard. My youth is nothing but a tale of an unlucky soul. I am at my lowest. I know you will be alright. If not, save your words for me to listen. My heart yearns for you. There are times when I am done with everything and I just want to escape from myself. I have a soul of a thousand year old town where the dead live. I miss your dove eyes, your beautiful curly hair, your canvas glittering lips. You are so beautiful like a statue made of ruby in the depth of my heart. I have a lot to say, but I am unable to find the right words to describe my existence.\n\nEid has passed and I missed your beautiful face in new clothes. I am quite sure you are looking like a garden princess. I pray you stay as amazing and splendid a soul as you are till your last day. Rania, my life is unworthy of your existence, I do not deserve you because when I am talking with you, when I think of you, I feel a spark of hope in my heart, hope is dangerous for me.\n\nWell, I have never forgotten you, you are always with me. I hope you will understand and forgive me. Whenever I come back I'm sure you will be here to read it, if not I will read this letter to birds and winds. The river will love your name to be hugged to. Nature will yearn for your beautiful eyes.\n\nTake care Rania. Stay blessed and may your light never dim.\n\nAbbas!",
      imagePath: "3.png"
    },
    {
      id: 4,
      date: "June 4",
      text: "My dear Rania!\n\nYesterday, I saw you in my dream, you were as clear as the sky after rain. I could see the redness of your cheeks, you were wearing a maroon dress with a white dupatta. I saw an angel come from a dream, a dream within a dream. You were silent like a bright sunny day. I could not touch your hand, if I could, my fingers would catch the everlasting fragrance of your beautiful existence. You just looked at me and smiled, your dove eyes were pinched by deep marshmallow cheeks. When I smiled back, you vanished like you never existed there. My eyes kissed the flying dust of the road, and I woke up.\n\nThe dream stuck in my mind. Idk why I am like this. I feel like I am born in a wrong universe. I feel I wasn't supposed to be born at all. The grief of my being is stronger than the precious things and souls around me. I miss you. Your eyes, if only you knew what your eyes are, two universes, but without orbits. Would you let me live as a tear within them? And if you cried, would your hands bring me back?\n\nAbbas!",
      imagePath: "4.jpeg"
    },
    {
      id: 5,
      date: "June 11",
      text: "Dear Rania!\n\nToday I am writing because I have nothing to say. I am just doodling. I don't know what to say, well, I got rejected from so many internships I applied to. Some of them don't even send me a rejection mail. It's been such a chaos, everything is falling apart. I cannot keep up. My motivation level is going down the bar. I am not even failing completely. Half success, half failure. It is really messed up. It will pass.\n\nRania! I hope you are doing great & enjoying your life as you must. Stay safe, take care, and stay hydrated. Eat well, sleep well.\n\nMy sweet Angel! If you won't take care of yourself, winds won't talk to me and the light will not embrace my words with passion.\n\nAbbas!",
      imagePath: "5.jpeg"
    },
    {
      id: 6,
      date: "July 5",
      text: "My dearest Rania!\n\nIt's been a long time since I wrote. I hope you are doing well. I am feeling nothing lately, the exhaustion has taken me over, well I could journal in the name of you. How are you my precious? How are your pretty eyes? I am wondering my heart has become rotten still it has the same light for you, it's like when you are walking in a dark forest, you can't see anything, the cold and harsh leaves touch your face here and there, after a while you see a light far away, a hope that the forest is going to end and you will be free, but when you get there eventually, it's just a broken signboard with a precious name like yours in dim blue light. Pardon me! I am yapping like a duck.\n\nRania, I am sorry that I left, my behaviour may have hurt your gem heart and I am guilty for that. Punish me the way you want. But if you can, forgive me, and say some words. I will keep them in my weary heart and soul. I am always so proud of you and I miss you. I will be back once I gather myself. I am currently trying to find myself. I am lost.\n\nAbbas!",
      imagePath: "6.jpeg"
    },
    {
      id: 7,
      date: "July 23",
      text: "My sweet Rania!\n\nHow are you Angelbreath? I hope you are okay! I know you will ask me how I am doing? I will say I'm okay, but actually I am not. I am purely hollowed. I wish I was okay & be a good friend to you. I failed you! I am becoming worse day by day. I'm shattering. I am a troubled kid. I remember you were hiding your father's existence when we talked about our parents. I don't know what's up with you both but I'm sure there's a void in that relationship. I felt you are troubled too. But you are strong. I know sometimes we get tired of being strong. We shed tears. We eat our lives, but I know you are strong. I am proud of you.\n\nMy precious! If I come back and you don't feel the same excitement as before, you can tell me straightforwardly, I will go back to my world. I don't want you to feel even a particle of uneasiness. I will not get hurt by you, I will always remember you as I am doing right now, remembering you. Yesterday, I was walking and there was a garden in a house, I smelled lavender. Your beautiful eyes flashed through my eyes like a memory. Your voice is so beautiful and soothing it should be sold in the pharmacies as a treatment. I miss you. I want to say more, more things but I can't.\n\n10 years of grief has wrinkled my being, I can't hold this life anymore... I wish I could die right now. I'm sorry... I am such an empty shell. Life is draining out of me, like there is a leak in my soul. I wish it didn't... I don't know why... I wish.\n\nAbbas!",
      imagePath: "7.png"
    },
    {
      id: 8,
      date: "August 13",
      text: "Dearest Rania!\n\nHow are you my stellina! I hope you will be fine & blessings will be showering upon you like the rivers of kisses around your pretty face. I miss you in the rains! These rains are warm & I wonder how warm your breath would be when you whisper your life's sorrows in my ear. I want to come back again like the old times. I am aching to see your notification on my screen. Will you let me enter the garden palace of your beautiful heart like a dear friend? I'm still not okay, I figured out I will never be okay, another reason is that I am far away from your existence. I don't know if I will be welcomed like before, what if I lose you, I don't know, but I know your heart, I have faith in it. I hope you will forgive me. I really hope :)\n\nAbbas!",
      imagePath: "8.jpeg"
    },
    {
      id: 9,
      date: "August 24",
      text: "My Serene Rania!\n\nYesterday I saw you in my dream... My God! You took my heartbeat away. How can someone be this special for a heart like an abandoned grave! You made me wake up from my sleep as if someone touches you to wake up. You have become fierce. I'm thinking about you lately, I feel I am losing you.\n\nI came to meet you, you were working at a posh bakery wearing an elegant black uniform with a contagious smile. All I could focus on was your magical eyes & majestic curly hair. You said, \"Wait for me outside, I'll come!\". I stood outside for eternity, you never came, when I went inside to see you, your oceanic eyes couldn't recognize me. I felt like I got hit by a meteor. My soul was on fire. My eyes got blur. It clicked, it was KARMA. I was away. I felt how it hurts. Why would an angel like you would even want to have a friend like me? I woke up with tears in my eyes. I'm so sorry for everything my dearest friend! I am a dumb bastard. I will beg you to forgive me. Please, be there when I come. I hope my letters would make you understand why I left, what were my mistakes and how will I win your heart again.\n\nAbbas!",
      imagePath: "9.jpeg"
    },
    {
      id: 10,
      date: "September 16",
      text: "My Marvelous Rania!\n\nHope you are doing okay! Life's got rough like a sandpaper scratching my face with its full capacity, and I couldn't forget you. Your name, your eyes are the part of my life worth yearning for. I hope you are there to read my letters. If not I'll say again, I'll read them to the winds. But deep down in my soul I know you are still there for me. I know you. I never met you face to face but I know you. I know you like a craftsman knows his strength. I miss you Ranno! I feel like you will look at the moon and remember something which makes you yearn. I hope that yearning doesn't weaken your dove eyes. I hope the moonlight will kiss them with immense love. Never lose hope. You are strong & amazing and I need you more than ever.\n\n* Radiohead sang this for me when you came into my life:\n\n[Song lyrics, not transcribed here. Switch to Handwriting to read this part.]\n\nBut Rania, you are the soul whose light is fighting with my darkness and I thank you for that. I thank God, that you exist!\n\nLove Abbas!",
      imagePath: "10.jpg"
    },
    {
      id: 11,
      date: "October 7",
      text: "My precious Rania! My little dove!\n\nOnce again greetings. I hope you are okay. I'm here to rant again haha! You can feel the nights are getting colder & so is my heart... God! I miss you so much! I think about you a lot. I don't know what's going on in your life, I pray that you are fine, & I don't know what's stopping me from coming back... I think about dying too, I think a lot. I'm so tired, tired as hell. I want to die, but my last wish is to wrap your scarf around my face & be buried under the cold soil so I take your smell with me. I die everyday.\n\nI can love a friend like this if I find one, worthy, & after I met you again, I couldn't find someone else like you to say all the things I said to you, you kind of filled that gap. I wish I was a fading dream, but I'm real, I'm ancient. It is who I am. It is what I am. A mystery. The world might feel lonely out there if you don't love yourself. Appreciate your little achievements Raano. You would think why he can't appreciate himself, the truth is, I am not mine. Abbas is just a mere nightmare. Please! Never be a hollow dot in the universe, you are amazingly marvelous. I know you. So much \"I\"s, My God I am so bad at writing.\n\nMy dearest Rania, please forgive me if you can, see you soon. We will talk again.\n\nAbbas!",
      imagePath: "11.jpg"
    }
  ];

  const els = {
    content: document.getElementById('content'),
    date: document.getElementById('date'),
    text: document.getElementById('letterText'),
    figure: document.getElementById('letterImage'),
    img: document.getElementById('letterImg'),
    missing: document.getElementById('imageMissing'),
    prev: document.getElementById('prev'),
    next: document.getElementById('next'),
    label: document.getElementById('progressLabel'),
    fill: document.getElementById('progressFill'),
    toggle: document.getElementById('toggle'),
    btnText: document.getElementById('btnText'),
    btnImage: document.getElementById('btnImage')
  };

  const FADE_MS = 280;
  let index = 0;
  let mode = 'text';
  let busy = false;

  function isSignoff(line) {
    return /^(love\s+)?abbas!?$/i.test(line.trim());
  }

  function renderText(letter) {
    els.text.textContent = '';
    letter.text.split('\n\n').forEach(function (block) {
      const p = document.createElement('p');
      if (isSignoff(block)) p.className = 'signoff';
      else if (block.charAt(0) === '[') p.className = 'note';
      p.textContent = block;
      els.text.appendChild(p);
    });
  }

  function renderImage(letter) {
    els.missing.hidden = true;
    els.img.hidden = false;
    els.img.alt = 'Handwritten letter dated ' + letter.date;
    els.img.onerror = function () {
      els.img.hidden = true;
      els.missing.hidden = false;
    };
    els.img.src = letter.imagePath;
  }

  function paint() {
    const letter = letters[index];
    const total = letters.length;

    els.date.textContent = letter.date;
    renderText(letter);
    renderImage(letter);

    els.text.hidden = mode !== 'text';
    els.figure.hidden = mode !== 'image';

    els.toggle.dataset.mode = mode;
    els.btnText.setAttribute('aria-pressed', String(mode === 'text'));
    els.btnImage.setAttribute('aria-pressed', String(mode === 'image'));

    els.label.textContent = 'Letter ' + (index + 1) + ' of ' + total;
    els.fill.style.width = ((index + 1) / total * 100) + '%';

    els.prev.disabled = index === 0;
    const last = index === total - 1;
    els.next.textContent = last ? 'End' : 'Next';
    els.next.disabled = last;
  }

  function transition(change, scrollTop) {
    if (busy) return;
    busy = true;
    els.content.classList.add('fading');
    setTimeout(function () {
      change();
      paint();
      if (scrollTop) window.scrollTo({ top: 0, behavior: 'auto' });
      requestAnimationFrame(function () {
        els.content.classList.remove('fading');
        setTimeout(function () { busy = false; }, FADE_MS);
      });
    }, FADE_MS);
  }

  function go(delta) {
    const target = index + delta;
    if (target < 0 || target >= letters.length) return;
    transition(function () { index = target; }, true);
  }

  function setMode(newMode) {
    if (newMode === mode) return;
    transition(function () { mode = newMode; }, false);
  }

  els.prev.addEventListener('click', function () { go(-1); });
  els.next.addEventListener('click', function () { go(1); });
  els.btnText.addEventListener('click', function () { setMode('text'); });
  els.btnImage.addEventListener('click', function () { setMode('image'); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });

  // simple swipe support on touch screens
  let touchX = null;
  document.addEventListener('touchstart', function (e) { touchX = e.changedTouches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 70) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  paint();
</script>
</body>
</html>
